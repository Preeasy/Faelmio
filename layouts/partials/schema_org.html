{{- $isHome := .IsHome }}
<script type="application/ld+json">
{{- if $isHome }}
{{ dict "@context" "https://schema.org" "@graph" (slice
  (dict
    "@type" (slice "LocalBusiness" "WholesaleStore")
    "@id" (printf "%s/#business" site.Home.Permalink)
    "name" site.Title
    "url" site.Home.Permalink
    "telephone" (site.Params.contact.phone_display | default "+86 182 5749 9725")
    "email" (site.Params.contact.email | default "maxon@maxoncn.com")
    "description" site.Params.description
    "logo" site.Params.assets.favicon
    "image" (index site.Params.images 0)
    "address" (dict "@type" "PostalAddress" "streetAddress" "Yiwu International Trade City" "addressLocality" "Yiwu" "addressRegion" "Zhejiang" "addressCountry" "CN")
    "sameAs" (slice site.Home.Permalink "https://yeatru.com")
    "priceRange" "$"
    "areaServed" "Worldwide"
  )
) | jsonify | safeJS }}
{{- else }}
{{ dict "@context" "https://schema.org" "@graph" (slice
  (dict
    "@type" (slice "LocalBusiness" "WholesaleStore")
    "@id" (printf "%s/#business" site.Home.Permalink)
    "name" site.Title
    "url" site.Home.Permalink
    "telephone" (site.Params.contact.phone_display | default "+86 182 5749 9725")
    "email" (site.Params.contact.email | default "maxon@maxoncn.com")
    "description" site.Params.description
    "logo" site.Params.assets.favicon
    "image" (index site.Params.images 0)
    "address" (dict "@type" "PostalAddress" "streetAddress" "Yiwu International Trade City" "addressLocality" "Yiwu" "addressRegion" "Zhejiang" "addressCountry" "CN")
    "sameAs" (slice site.Home.Permalink "https://yeatru.com")
    "priceRange" "$"
    "areaServed" "Worldwide"
  )
  (dict
    "@type" "BreadcrumbList"
    "itemListElement" (slice
      (dict "@type" "ListItem" "position" 1 "name" (site.Title) "item" site.Home.Permalink)
      (dict "@type" "ListItem" "position" 2 "name" .Title "item" .Permalink)
    )
  )
) | jsonify | safeJS }}
{{- end }}
</script>
