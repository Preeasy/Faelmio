baseURL = "https://www.faelmio.com"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
languageCode = "en-us"
title = "Faelmio | Yiwu Toy Sourcing Agent"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
paginate = 12
paginatePath = "page"

