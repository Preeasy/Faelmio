[params]
env = "production"
title = "Faelmio | Yiwu Toy Sourcing Agent"
description = "Professional Yiwu toy sourcing agent for B2B buyers. OEM custom toys, AQL QC, consolidation and DDP shipping to EU, USA, Latin America and Japan."
keywords = ["Yiwu toy sourcing agent", "toy sourcing China", "OEM toy manufacturer", "wholesale toys Yiwu", "Amazon FBA toy supplier", "plush toys wholesale", "educational toys sourcing", "fidget toys supplier"]
author = "Faelmio"
images = ["https://images.faelmio.com/social/faelmio-og.jpg"]
DateFormat = "January 2, 2006"
defaultTheme = "light"
disableThemeToggle = true
ShowReadingTime = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = false
ShowWordCount = false
ShowRssButtonInSectionTermList = false
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = true
hideSummary = false
showtoc = true
tocopen = false
copyright = "© 2026 Faelmio. All rights reserved."

[params.assets]
disableFingerprinting = true
favicon = "https://images.faelmio.com/favicon.ico"

[params.schema]
publisherType = "WholesaleStore"

[privacy]
[privacy.disqus]
disable = true
[privacy.googleAnalytics]
disable = true

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noclasses = false
style = "github"
