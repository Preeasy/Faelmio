    <circle cx="0" cy="-50" r="10" fill="#F4B740"/>
    <path d="M-40 20 Q-10 40 20 10" stroke="#FBF7EE" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
  </g>
  <g transform="translate(1200 250)" opacity="0.95">
    <rect x="-60" y="-80" width="120" height="160" rx="6" fill="#FBF7EE" stroke="#141B2D" stroke-width="3"/>
    <rect x="-50" y="-70" width="100" height="8" rx="2" fill="#141B2D"/>
    <rect x="-50" y="-52" width="60" height="6" rx="2" fill="#F2643C"/>
    <rect x="-50" y="-38" width="90" height="4" rx="2" fill="#2A3348" opacity="0.6"/>
    <rect x="-50" y="-28" width="70" height="4" rx="2" fill="#2A3348" opacity="0.5"/>
    <rect x="-50" y="-18" width="80" height="4" rx="2" fill="#2A3348" opacity="0.6"/>
    <rect x="-50" y="2" width="90" height="4" rx="2" fill="#2A3348" opacity="0.5"/>
