  <g transform="translate(1420 380)" opacity="0.9">
    <circle cx="0" cy="0" r="42" fill="#F2643C"/>
    <path d="M-18 0 L-6 14 L18 -14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- soft dots confetti -->
  <circle cx="110" cy="200" r="6" fill="#F2643C" opacity="0.5"/>
  <circle cx="1480" cy="140" r="5" fill="#F4B740" opacity="0.55"/>
  <circle cx="1260" cy="120" r="4" fill="#2A3348" opacity="0.4"/>
  <circle cx="520" cy="160" r="5" fill="#F2643C" opacity="0.4"/>
  <circle cx="720" cy="140" r="4" fill="#F4B740" opacity="0.5"/>
  <circle cx="360" cy="220" r="5" fill="#1B3A8F" opacity="0.3"/>

