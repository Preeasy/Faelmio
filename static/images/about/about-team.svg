      <circle cx="-10" cy="-28" r="3" fill="#141B2D"/>
      <circle cx="10" cy="-28" r="3" fill="#141B2D"/>
      <path d="M-8 -16 Q0 -10 8 -16" stroke="#141B2D" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(330 14)">
      <rect x="-40" y="0" width="80" height="168" rx="16" fill="#F4B740"/>
      <circle cx="0" cy="-28" r="34" fill="#FBE2D6"/>
      <path d="M-34 -40 Q0 -66 34 -40 L34 -28 L-34 -28 Z" fill="#2A3348"/>
      <circle cx="-10" cy="-28" r="3" fill="#141B2D"/>
      <circle cx="10" cy="-28" r="3" fill="#141B2D"/>
      <path d="M-8 -16 Q0 -10 8 -16" stroke="#141B2D" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(440 2)">
