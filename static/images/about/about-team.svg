  <g transform="translate(100 120)">
    <rect x="-6" y="30" width="6" height="96" fill="#F2643C"/>
    <text x="20" y="70" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="700" fill="#141B2D">Meet the team</text>
