<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F2EAD9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Yiwu-style commodity market silhouette on horizon -->
  <g transform="translate(0 540)" fill="#D9CFBC" opacity="0.55">
    <rect x="0" y="0" width="160" height="140"/>
    <rect x="170" y="-40" width="200" height="180"/>
    <rect x="380" y="-10" width="120" height="150"/>
    <rect x="510" y="-70" width="240" height="210"/>
    <rect x="760" y="-20" width="140" height="160"/>
    <rect x="910" y="-80" width="200" height="220"/>
    <rect x="1120" y="-30" width="180" height="170"/>
    <rect x="1310" y="-50" width="200" height="190"/>
    <polygon points="170,-40 270,-100 370,-40"/>
    <polygon points="510,-70 630,-130 750,-70"/>
    <polygon points="910,-80 1010,-140 1110,-80"/>
  </g>
  <line x1="0" y1="680" x2="1600" y2="680" stroke="#C8BBA2" stroke-width="2"/>

