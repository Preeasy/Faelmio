<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Faelmio — Toy sourcing agent in Yiwu, China">
  <defs>
    <style>
      .logofont { font-family: 'Fraunces', Georgia, serif; font-weight: 800; letter-spacing: -0.02em; }
    </style>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A4F"/>
      <stop offset="1" stop-color="#D94E28"/>
    </linearGradient>
  </defs>

  <!-- ===== Mark: two stacked toy blocks ===== -->
  <!-- lower large block -->
  <g transform="translate(14, 18)">
    <rect x="2" y="10" width="64" height="64" rx="14" ry="14" fill="#141B2D"/>
    <!-- top small block (coral) overlapping -->
    <rect x="10" y="0" width="40" height="28" rx="9" ry="9" fill="url(#coralGrad)"/>
    <!-- coral block studs (toy studs) -->
    <circle cx="20" cy="14" r="4" fill="#FFD7CC"/>
    <circle cx="34" cy="14" r="4" fill="#FFD7CC"/>
    <!-- ink block single stud -->
    <circle cx="48" cy="42" r="5" fill="#6E7690"/>
    <!-- accent dot — hint of eye / toy face -->
    <circle cx="20" cy="42" r="5" fill="#F2643C"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <!-- F = coral accent; rest = ink -->
  <text class="logofont" x="112" y="82" font-size="62" fill="#F2643C">F</text>
  <text class="logofont" x="158" y="82" font-size="62" fill="#141B2D">aelmio</text>

  <!-- subtitle -->
  <text x="112" y="106" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600"
        letter-spacing="0.22em" text-transform="uppercase" fill="#6E7690">Toy sourcing · Yiwu · Since 2008</text>
</svg>
