<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F2EADB"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B63"/>
      <stop offset="0.5" stop-color="#F2643C"/>
      <stop offset="1" stop-color="#C9471F"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#B9CBA6"/>
      <stop offset="0.55" stop-color="#93AC80"/>
      <stop offset="1" stop-color="#6E8A5D"/>
    </linearGradient>
    <linearGradient id="plush" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.6" stop-color="#F4B740"/>
      <stop offset="1" stop-color="#D99A22"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6A4F"/>
      <stop offset="1" stop-color="#5C4433"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#light)"/>

  <!-- soft floor shadows -->
  <ellipse cx="450" cy="905" rx="330" ry="90" fill="#141B2D" opacity="0.055"/>
  <ellipse cx="300" cy="880" rx="120" ry="34" fill="#141B2D" opacity="0.06"/>
  <ellipse cx="640" cy="830" rx="86" ry="26" fill="#141B2D" opacity="0.06"/>

  <!-- ============ braided rope chew (center) ============ -->
  <g transform="translate(450 610)">
    <circle r="168" fill="none" stroke="url(#rope)" stroke-width="52"/>
    <!-- braid texture: short diagonal strokes following the ring -->
    <g stroke="#FFD9CC" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <g transform="rotate(0)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(30)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(60)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(90)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(120)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(150)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(180)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(210)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(240)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(270)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(300)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
      <g transform="rotate(330)"><path d="M-26 -166 l34 30"/><path d="M26 -166 l-34 30"/></g>
    </g>
    <!-- top highlight -->
    <path d="M-150 -80 A 170 170 0 0 1 -60 -158" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ============ rubber ball (right) ============ -->
  <g transform="translate(650 800)">
    <circle r="96" fill="url(#rubber)"/>
    <path d="M-96 0 A 96 96 0 0 0 96 0" fill="#5F7A50" opacity="0.25"/>
    <ellipse cx="-34" cy="-38" rx="30" ry="22" fill="#FFFFFF" opacity="0.42" transform="rotate(-28)"/>
    <!-- paw emboss -->
    <g fill="#E9F0E1" opacity="0.55">
      <ellipse cx="0" cy="14" rx="17" ry="14"/>
      <circle cx="-20" cy="-12" r="8"/>
      <circle cx="-2" cy="-20" r="8"/>
      <circle cx="17" cy="-12" r="8"/>
    </g>
  </g>

  <!-- ============ plush bone (left) ============ -->
  <g transform="translate(232 850) rotate(-14)">
    <g fill="url(#plush)">
      <circle cx="-96" cy="-34" r="34"/>
      <circle cx="-96" cy="34" r="34"/>
      <circle cx="96" cy="-34" r="34"/>
      <circle cx="96" cy="34" r="34"/>
      <rect x="-100" y="-32" width="200" height="64" rx="30"/>
    </g>
    <rect x="-70" y="-24" width="140" height="10" rx="5" fill="#FFFFFF" opacity="0.42"/>
    <!-- stitch -->
    <path d="M-96 -34 v68" stroke="#B87A12" stroke-width="3" stroke-dasharray="7 7" opacity="0.5"/>
    <path d="M96 -34 v68" stroke="#B87A12" stroke-width="3" stroke-dasharray="7 7" opacity="0.5"/>
  </g>

  <!-- ============ cat teaser wand (top) ============ -->
  <g transform="translate(430 300) rotate(-24)">
    <rect x="-10" y="-150" width="20" height="330" rx="10" fill="url(#wood)"/>
    <rect x="-4" y="-140" width="5" height="300" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <!-- feather cluster -->
    <g transform="translate(0 -150)">
      <path d="M0 0 C -46 -52 -70 -96 -58 -132 C -34 -120 -12 -92 0 -60 Z" fill="#F2643C" opacity="0.92"/>
      <path d="M0 0 C 46 -52 70 -96 58 -132 C 34 -120 12 -92 0 -60 Z" fill="#FF8B63" opacity="0.92"/>
      <path d="M0 0 C -16 -66 -8 -112 0 -138 C 8 -112 16 -66 0 0 Z" fill="#FBF7EE" opacity="0.95"/>
      <circle cx="0" cy="-10" r="12" fill="#141B2D" opacity="0.8"/>
    </g>
    <!-- string -->
    <path d="M0 -150 C 14 -186 34 -196 52 -206" fill="none" stroke="#141B2D" stroke-width="4" opacity="0.65"/>
    <circle cx="54" cy="-208" r="7" fill="#F4B740"/>
  </g>

  <!-- ============ paw motif (top right, faint) ============ -->
  <g transform="translate(760 210)" fill="#F2643C" opacity="0.16">
    <ellipse cx="0" cy="26" rx="34" ry="28"/>
    <circle cx="-38" cy="-14" r="15"/>
    <circle cx="-12" cy="-30" r="15"/>
    <circle cx="16" cy="-30" r="15"/>
    <circle cx="40" cy="-12" r="15"/>
  </g>

  <!-- ============ small star toy (bottom right) ============ -->
  <g transform="translate(770 1010) rotate(18)">
    <path d="M0 -62 L18 -20 L62 -14 L30 14 L40 58 L0 34 L-40 58 L-30 14 L-62 -14 L-18 -20 Z" fill="#F4B740"/>
    <path d="M0 -62 L18 -20 L62 -14 L30 14 L40 58 L0 34 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- grain overlay -->
  <rect width="900" height="1200" fill="none"/>
</svg>
