<?xml version="1.0" encoding="UTF-8"?>
<!-- Pure mark — no wordmark. For favicon, WhatsApp profile, Instagram/Twitter avatar, email signature, app icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Faelmio mark">
  <defs>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A4F"/>
      <stop offset="1" stop-color="#D94E28"/>
    </linearGradient>
  </defs>
  <!-- large ink block -->
  <rect x="12" y="24" width="88" height="80" rx="18" ry="18" fill="#141B2D"/>
  <!-- coral block overlapping top-right -->
  <rect x="30" y="0" width="60" height="42" rx="13" ry="13" fill="url(#coralGrad)"/>
  <!-- coral block studs -->
  <circle cx="46" cy="21" r="6" fill="#FFD7CC"/>
  <circle cx="64" cy="21" r="6" fill="#FFD7CC"/>
  <!-- ink block eyes (two dots = toy face) -->
  <circle cx="42" cy="62" r="6" fill="#6E7690"/>
  <circle cx="78" cy="62" r="6" fill="#F2643C"/>
  <!-- subtle smile curve -->
  <path d="M 42 82 Q 60 94 78 82" stroke="#FBF7EE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
